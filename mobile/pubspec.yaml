name: swift_shipping_label
description: Swift Oilfield Supply - Document Generator (Shipping, Receiving, Bill of Lading, Bulk Labels).
publish_to: "none"
version: 1.2.1+128

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.11.3
  vector_math: ^2.1.4
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.2.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  file_selector: ^1.0.3
  open_filex: ^4.7.0
  timezone: ^0.10.0
  image: ^4.5.4
  ffi: ^2.1.3
  pdfrx: ^2.4.7
  archive: ^4.0.9
  xml: ^7.0.1
  flutter_svg: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/swift_supply_logo_orange.png
    - assets/images/swift_supply_logo_orange.svg
    - assets/images/swift_supply_logo_orange_solid.png
    - assets/images/swift_supply_logo_document.png
    - assets/images/swift_supply_header_white.png
    - assets/images/sample_customer_logo.png
    - assets/images/propak_logo.png
    - assets/images/carrier_murrays.png
    - assets/images/carrier_dunrite.png
    - assets/images/slst_app_icon.png
    - assets/images/slst_still_dashboard.png
    - assets/images/slst_still_staging.png
    - assets/images/slst_still_warehouse.png
    - assets/images/slst_still_shipped.png
    - assets/images/briysce_wordmark_paper.svg
    - assets/images/app_icon.png
    - assets/images/app_icon_1024.png
    - assets/templates/propak_avery_5163.docx
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: Calibri
      fonts:
        - asset: assets/fonts/Calibri.ttf
        - asset: assets/fonts/Calibri-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
